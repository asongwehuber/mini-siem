<!DOCTYPE html>
<html>

<head>

<title>Create Administrator</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="admin-page">


<div class="admin-container">


<div class="admin-card">


<h1>
Create Administrator
</h1>



{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="flash {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}




<form method="POST"
      class="admin-form"
      autocomplete="off">



<label>
Full Name
</label>

<input
type="text"
name="fullname"
autocomplete="off"
required>




<label>
Email
</label>

<input
type="email"
name="email"
autocomplete="off"
required>




<label>
Password
</label>

<input
id="password"
type="password"
name="password"
autocomplete="new-password"
required>



<label class="show-password">

<input
type="checkbox"
onchange="togglePassword('password', this)">

Show Password

</label>


<label>
Confirm Password
</label>

<input
id="confirm_password"
type="password"
name="confirm_password"
autocomplete="new-password"
required>




<label class="show-password">

<input
type="checkbox"
onchange="togglePassword('confirm_password', this)">

Show Password

</label>






<label>
Role
</label>


<select name="role">

<option value="admin">

Administrator

</option>

</select>




<br>



<button type="submit"
        class="admin-btn admin-btn-primary">

Create Administrator

</button>



</form>




<br>



<a href="{{ url_for('auth.admin_dashboard') }}"
   class="admin-btn admin-btn-secondary">

← Back

</a>



</div>


</div>


</div>





<script>

function togglePassword(id, checkbox){

    let field = document.getElementById(id);


    if(checkbox.checked){

        field.type = "text";

    }

    else{

        field.type = "password";

    }

}

</script>



</body>

</html>
