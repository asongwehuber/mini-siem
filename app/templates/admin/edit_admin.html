<!DOCTYPE html>
<html>

<head>

<title>Edit Administrator</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="admin-page">


<div class="admin-container">


<div class="admin-card">


<h1>
Edit Administrator
</h1>



<form method="POST"
      class="admin-form">



<label>
Full Name
</label>

<input
type="text"
name="fullname"
value="{{ admin.fullname }}"
required>



<label>
Email
</label>

<input
type="email"
name="email"
value="{{ admin.email }}"
required>



<label>
Role
</label>


<select name="role">


<option value="admin"
{% if admin.role == "admin" %}
selected
{% endif %}
>

Administrator

</option>



<option value="super_admin"
{% if admin.role == "super_admin" %}
selected
{% endif %}
>

Super Administrator

</option>


</select>



<button type="submit"
        class="admin-btn admin-btn-primary">

Save Changes

</button>



</form>



<br>



<a href="{{ url_for('auth.admin_dashboard') }}"
   class="admin-btn admin-btn-secondary">

← Back

</a>


</div>


</div>


</div>


</body>

</html>
